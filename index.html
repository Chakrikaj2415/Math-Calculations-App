<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calculations App</title>
</head>
<body>
   <div class="calculator-container">
        <h2>Math Calculations App</h2>
        
        <div class="form-group">
            <label for="fname">Enter Problem</label>
            <input type="text" id="fname" name="fname" placeholder="5x+5=20">
        </div>

        <div class="form-group">
            <label for="fileToLoad">Upload Data File:</label>
            <input type="file" id="fileToLoad">
        </div>
    <button>Solve</button>
    <div class="calculator-buttons">
        <button onclick="calculateAverage()">Calculate Average</button>
        <button onclick="findMax()">Find Maximum</button>
        <button onclick="findMin()">Find Minimum</button>
    </div>
    <script src="js/math.js"></script>

</body>
</html>
