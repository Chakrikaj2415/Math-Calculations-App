<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calculations App</title>
</head>
<body>
   <div class="calculator-container">
        <h2>Math Calculations App</h2>
        
        <!-- Text Input for Math Class / Standard Calculations -->
        <div class="form-group">
            <label for="fname">Enter Problem / Number:</label>
            <input type="text" id="fname" name="fname" placeholder="e.g., 5*5">
        </div>
        <button onclick="calculateInput()">Calculate Input</button>

        <hr>

        <!-- File Upload Section -->
        <div class="form-group">
            <label for="fileToLoad">Upload Data File:</label>
            <input type="file" id="fileToLoad">
        </div>
        <button class="button" onclick="checkFileProperty()">Load Selected</button>

        <!-- Output and Text Area -->
        <p id="Message"></p>
        <textarea class="textinput" id="fileInput" cols="40" rows="5" placeholder="File contents will load here..."></textarea>
        
        <!-- Statistical Question Buttons -->
        <div class="stat-buttons">
            <button onclick="calculateAverage()">Calculate Average</button>
            <button onclick="findMax()">Find Maximum</button>
            <button onclick="findMin()">Find Minimum</button>
            <button id="myBtn">Solve</button>
        </div>
    </div>

    <script src="js/saveText.js"></script>
    <script src="js/readTextArea.js"></script>
</body>
</html>
