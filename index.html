<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calculations App</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Math Calculations App</h2>
        
        <div class="form-group">
            <label for="fname">Enter Problem / Number:</label>
            <input type="text" id="fname" name="fname" placeholder="e.g., 5*5">
        </div>
        <button type="button" onclick="calculateInput()">Calculate Input</button>

        <hr>

        <div class="form-group">
            <label for="fileToLoad">Upload Data File:</label>
            <input type="file" id="fileToLoad">
        </div>
        <button type="button" class="button" onclick="checkFileProperty()">Load Selected</button>

        <!-- Output and Text Area -->
        <div class="output-group">
            <p id="Message"></p>
            <textarea class="textinput" id="fileInput" cols="40" rows="5" placeholder="File contents will load here..."></textarea>
        </div>
        
        <div class="stat-buttons">
            <button type="button" onclick="calculateAverage()">Average</button>
            <button type="button" onclick="calculateMedian()">Median</button>
            <button type="button" onclick="calculateMode()">Mode</button>
            <button type="button" onclick="findMax()">Max</button>
            <button type="button" onclick="findMin()">Min</button>
        </div>

        <button type="button" class="theme-btn" onclick="toggleBackground()" style="background-color: #5f6368; margin-top: 15px;">Dark Mode</button>
    </div>

    <script src="js/saveText.js"></script>
    <script src="js/readTextArea.js"></script>
</body>
</html>
